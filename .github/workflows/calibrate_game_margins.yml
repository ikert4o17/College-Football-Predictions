name: Calibrate Game Margins

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify calibration inputs
        run: |
          echo "============================================================"
          echo "VERIFY CALIBRATION INPUTS"
          echo "============================================================"
          echo ""

          MISSING=0

          if [ -f "data/processed/power_ratings_2025.json" ]; then
            echo "FOUND: data/processed/power_ratings_2025.json"
          else
            echo "MISSING: data/processed/power_ratings_2025.json"
            MISSING=1
          fi

          if [ -f "data/processed/historical_games_2025.json" ]; then
            echo "FOUND: data/processed/historical_games_2025.json"
          else
            echo "MISSING: data/processed/historical_games_2025.json"
            MISSING=1
          fi

          if [ -f "ratings/calibrate_game_margins_v3.py" ]; then
            echo "FOUND: ratings/calibrate_game_margins_v3.py"
          else
            echo "MISSING: ratings/calibrate_game_margins_v3.py"
            MISSING=1
          fi

          echo ""

          if [ "$MISSING" -ne 0 ]; then
            echo "ERROR: One or more required files are missing."
            exit 1
          fi

          echo "Input check: PASS"

      - name: Inspect calibration module
        run: |
          echo "============================================================"
          echo "CALIBRATION MODULE INSPECTION"
          echo "============================================================"
          echo ""

          ls -lh ratings/calibrate_game_margins_v3.py

          echo ""
          echo "Last 25 lines:"
          echo "------------------------------------------------------------"

          tail -n 25 ratings/calibrate_game_margins_v3.py

      - name: Run 2025 game margin calibration V3
        run: |
          set -o pipefail

          echo "============================================================"
          echo "RUNNING PROJECT GRIDIRON CALIBRATION V3"
          echo "============================================================"
          echo ""

          python -u -m ratings.calibrate_game_margins_v3

          STATUS=$?

          echo ""
          echo "============================================================"
          echo "PYTHON RESULT"
          echo "============================================================"
          echo ""

          echo "Python exit status: $STATUS"

          echo ""
          echo "Expected output:"
          echo "data/processed/game_margin_calibration_v3_2025.json"
          echo ""

          if [ -f "data/processed/game_margin_calibration_v3_2025.json" ]; then
            echo "OUTPUT CREATED"
            ls -lh data/processed/game_margin_calibration_v3_2025.json
          else
            echo "OUTPUT NOT CREATED"
          fi

          exit $STATUS

      - name: Validate calibration output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/processed/game_margin_calibration_v3_2025.json"
          )

          print("=" * 78)
          print("GAME MARGIN CALIBRATION V3 OUTPUT CHECK")
          print("=" * 78)
          print()

          if not path.exists():
              raise SystemExit(
                  "Calibration V3 output file was not created."
              )

          with path.open(
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          required_top_level = {
              "season",
              "model_version",
              "games_tested",
              "model",
              "metrics",
              "skipped",
          }

          missing = (
              required_top_level
              -
              set(data)
          )

          if missing:
              raise SystemExit(
                  f"Missing top-level fields: {sorted(missing)}"
              )

          model = data["model"]
          metrics = data["metrics"]

          required_model_fields = {
              "rating_gap_coefficient",
              "home_field_advantage",
          }

          missing_model = (
              required_model_fields
              -
              set(model)
          )

          if missing_model:
              raise SystemExit(
                  f"Missing model fields: {sorted(missing_model)}"
              )

          print(
              f"Model version: "
              f"{data['model_version']}"
          )

          print(
              f"Games tested: "
              f"{data['games_tested']}"
          )

          print()

          print("CALIBRATION MODEL")
          print("-" * 78)

          print(
              f"Rating gap coefficient: "
              f"{model['rating_gap_coefficient']:.4f}"
          )

          print(
              f"Home-field advantage: "
              f"{model['home_field_advantage']:.4f}"
          )

          print()

          print("MODEL PERFORMANCE")
          print("-" * 78)

          for key in [
              "raw_rating_gap_correlation",
              "prediction_correlation",
              "mae",
              "rmse",
              "actual_margin_mean",
              "prediction_mean",
              "actual_margin_std",
              "prediction_std",
              "neutral_games",
              "non_neutral_games",
              "neutral_actual_margin_mean",
              "non_neutral_actual_margin_mean",
          ]:

              value = metrics.get(key)

              if value is None:
                  print(
                      f"{key}: N/A"
                  )

              elif isinstance(value, int):
                  print(
                      f"{key}: {value}"
                  )

              else:
                  print(
                      f"{key}: {value:.4f}"
                  )

          print()

          print("SKIPPED RECORDS")
          print("-" * 78)

          for key, value in data["skipped"].items():
              print(
                  f"{key}: {value}"
              )

          print()
          print("Output validation: PASS")
          PY

      - name: Show git status
        run: |
          echo "============================================================"
          echo "GIT STATUS"
          echo "============================================================"
          echo ""

          git status --short

      - name: Commit calibration V3 output
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed/game_margin_calibration_v3_2025.json

          if git diff --cached --quiet; then
            echo "No calibration V3 changes to commit."
          else
            git commit -m \
              "Calibrate Project Gridiron game margins V3"

            git push
          fi
