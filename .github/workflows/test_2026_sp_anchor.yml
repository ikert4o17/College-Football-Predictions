name: Test 2026 Preseason SP+ Anchor

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test_2026_sp_anchor.yml"

permissions:
  contents: write

jobs:
  test-anchor:
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify CFBD secret
        run: |
          if [ -z "$CFBD_API_KEY" ]; then
            echo "CFBD_API_KEY repository secret is required."
            exit 1
          fi

      - name: Download 2026 SP+ ratings
        env:
          FORCE_CFBD_REFRESH: "1"
        run: python -m data.download_sp_ratings 2026 2026

      - name: Run same-season SP+ anchor experiment
        run: python -m ratings.preseason_model_v4_2026_sp_anchor

      - name: Commit experiment outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/sp_ratings/2026.json \
                  data/processed/preseason_ratings_v4_2026_sp_anchor.json \
                  data/processed/preseason_2026_anchor_comparison.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Test 2026 preseason SP+ anchor"
            git push
          fi
