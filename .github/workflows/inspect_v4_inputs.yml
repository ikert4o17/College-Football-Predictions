name: Inspect V4 Inputs

on:
  workflow_dispatch:

jobs:
  inspect-v4-inputs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect V4 input files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")

          files = {
              "sp_2024": root / "data/raw/sp_ratings/2024.json",
              "gridiron_2024": root / "data/processed/power_ratings_2024.json",
              "gridiron_2025": root / "data/processed/power_ratings_2025.json",
              "returning": root / "data/processed/returning_production_2025.json",
              "transfer_talent": root / "data/processed/transfer_talent_2025.json",
              "transfer_production": root / "data/processed/transfer_production_v2_2025.json",
              "qb": root / "data/processed/qb_continuity_2025.json",
              "coaching": root / "data/processed/coaching_continuity_v2_2025.json",
          }

          print("=" * 80)
          print("PROJECT GRIDIRON V4 INPUT INSPECTION")
          print("=" * 80)
          print()

          for name, path in files.items():
              print("-" * 80)
              print(name)
              print(path)

              if not path.exists():
                  print("STATUS: MISSING")
                  print()
                  continue

              print("STATUS: FOUND")

              try:
                  with path.open("r", encoding="utf-8") as f:
                      data = json.load(f)
              except Exception as exc:
                  print(f"JSON ERROR: {exc}")
                  print()
                  continue

              print(f"TYPE: {type(data).__name__}")

              if isinstance(data, list):
                  print(f"RECORDS: {len(data)}")

                  if data:
                      first = data[0]
                      print("FIRST RECORD:")
                      print(json.dumps(first, indent=2))

                      if isinstance(first, dict):
                          print("TOP-LEVEL KEYS:")
                          for key in sorted(first.keys()):
                              print(f"  {key}")

              elif isinstance(data, dict):
                  print(f"TOP-LEVEL KEYS: {len(data)}")

                  for key in list(data.keys())[:20]:
                      print(f"  {key}")

                  sample_key = next(iter(data), None)

                  if sample_key is not None:
                      print(f"SAMPLE KEY: {sample_key}")
                      print("SAMPLE VALUE:")
                      print(json.dumps(data[sample_key], indent=2))

              print()

      - name: Inspect possible alternate V4 files
        run: |
          echo "Possible V4-related processed files:"
          echo ""

          find data/processed -maxdepth 1 -type f \
            \( \
              -iname "*return*" \
              -o -iname "*transfer*" \
              -o -iname "*qb*" \
              -o -iname "*coach*" \
              -o -iname "*sp*" \
            \) \
            -print | sort || true

          echo ""
          echo "Possible V4-related raw files:"
          echo ""

          find data/raw -type f \
            \( \
              -iname "*return*" \
              -o -iname "*transfer*" \
              -o -iname "*qb*" \
              -o -iname "*coach*" \
              -o -iname "*sp*" \
            \) \
            -print | sort || true
