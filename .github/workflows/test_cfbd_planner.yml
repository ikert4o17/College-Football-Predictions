name: Test CFBD Planner

on:
  workflow_dispatch:

jobs:
  test-planner:
    runs-on: ubuntu-latest

    env:
      CFBD_MAX_CALLS_THIS_RUN: "75"
      CFBD_REQUEST_BUDGET_RUN_ID: ${{ github.run_id }}
      CFBD_MIN_REMAINING_CALLS: "100"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Initialize CFBD request budget
        run: |
          python -m data.cfbd_request_budget

      - name: Test cache-build planner offline
        run: |
          python -m data.plan_cfbd_requests cache-build --offline

      - name: Test weekly planner offline
        env:
          CFBD_MAX_CALLS_THIS_RUN: "20"
        run: |
          python -m data.plan_cfbd_requests weekly --offline

      - name: Build CFBD cache manifest
        run: |
          python -m data.build_cfbd_cache_manifest

      - name: Show cache manifest
        run: |
          echo "CFBD cache manifest:"
          echo ""
          if [ -f "data/cache/cfbd/manifest.json" ]; then
            cat data/cache/cfbd/manifest.json
          else
            echo "No manifest file found."
          fi

      - name: Show request budget state
        if: always()
        run: |
          python -m data.cfbd_request_budget

      - name: Show cache files
        if: always()
        run: |
          echo "CFBD cache files:"
          echo ""
          find data/cache/cfbd -type f -print 2>/dev/null | sort || true
