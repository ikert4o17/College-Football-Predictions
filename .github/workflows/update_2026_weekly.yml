name: Update 2026 Weekly Data

on:
  workflow_dispatch:
    inputs:
      allow_reserve_use:
        description: "Allow use of protected CFBD reserve"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update-2026:
    runs-on: ubuntu-latest

    env:
      CFBD_MAX_CALLS_THIS_RUN: "20"
      CFBD_REQUEST_BUDGET_RUN_ID: ${{ github.run_id }}

    steps:

      # ============================================================
      # SETUP
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ============================================================
      # REQUEST BUDGET
      # ============================================================

      - name: Initialize CFBD request budget
        run: |
          python -m data.cfbd_request_budget

      # ============================================================
      # MONTHLY QUOTA PROTECTION
      # ============================================================

      - name: Check CFBD quota guard
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFBD_MIN_REMAINING_CALLS: "100"
          CFBD_ALLOW_RESERVE_USE: ${{ inputs.allow_reserve_use }}
        run: |
          python -m data.check_cfbd_quota_guard

      - name: Show CFBD usage
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.check_cfbd_usage

      # ============================================================
      # 2026 DOWNLOADS ONLY
      # ============================================================

      - name: Download 2026 games
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_games 2026

      - name: Download 2026 returning production
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_returning_production 2026

      - name: Download 2026 transfer portal
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_transfer_portal 2026

      - name: Download 2026 recruiting players
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_recruiting_players 2026 2026

      # ============================================================
      # PROCESS 2026 DATA
      # ============================================================

      - name: Process 2026 games
        run: |
          python -m data.process_games 2026

      - name: Process 2026 returning production
        run: |
          python -m data.process_returning_production 2026

      - name: Process 2026 transfer portal
        run: |
          python -m data.process_transfer_portal 2026

      - name: Enrich 2026 transfer portal
        run: |
          python -m data.enrich_transfer_portal 2026

      # ============================================================
      # 2026 MODEL FEATURES
      # ============================================================

      - name: Calculate 2026 transfer talent
        run: |
          python -m ratings.transfer_talent 2026

      - name: Calculate 2026 recruiting talent
        run: |
          python -m ratings.recruiting_talent 2026

      # ============================================================
      # 2026 PRESEASON / POWER RATINGS
      # ============================================================

      - name: Generate 2026 Project Gridiron preseason ratings
        run: |
          python -m ratings.preseason_rating_2026

      # ============================================================
      # INSPECT OUTPUTS
      # ============================================================

      - name: Show 2026 raw files
        run: |
          echo "2026 raw data:"
          echo ""
          find data/raw -type f -path "*2026*" -print 2>/dev/null | sort || true

      - name: Show 2026 processed files
        run: |
          echo "2026 processed/model files:"
          echo ""
          find data/processed -type f -print 2>/dev/null | sort || true

      - name: Show CFBD cache files
        run: |
          echo "CFBD cache:"
          echo ""
          find data/cache/cfbd -type f -print 2>/dev/null | sort || true

      # ============================================================
      # REQUEST BUDGET SUMMARY
      # ============================================================

      - name: Show CFBD request budget
        if: always()
        run: |
          python -m data.cfbd_request_budget

      # ============================================================
      # PERSIST UPDATED DATA
      # ============================================================

      - name: Commit updated 2026 data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d "data/cache/cfbd" ]; then
            git add data/cache/cfbd
          fi

          if [ -d "data/raw" ]; then
            git add data/raw
          fi

          if [ -d "data/processed" ]; then
            git add data/processed
          fi

          if git diff --cached --quiet; then
            echo "No 2026 data changes to commit."
          else
            git commit -m "Update 2026 weekly model data"
            git push
          fi

      # ============================================================
      # FINAL CFBD USAGE REPORT
      # ============================================================

      - name: Show remaining CFBD usage
        if: always()
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.check_cfbd_usage
