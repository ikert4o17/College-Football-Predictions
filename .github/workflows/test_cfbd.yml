name: Update FBS Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download 2024 QB data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_qb_data 2024

      - name: Download 2025 QB data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_qb_data 2025

      - name: Calculate 2025 QB continuity
        run: |
          python -m ratings.qb_continuity 2025

      - name: Validate 2025 QB continuity
        run: |
          python -m ratings.validate_qb_continuity

      - name: Calculate 2025 transfer production
        run: |
          python -m ratings.transfer_production 2025

      - name: Calculate 2025 transfer production V2
        run: |
          python -m ratings.transfer_production_v2 2025

      - name: Validate 2025 transfer production V2
        run: |
          python -m ratings.validate_transfer_production_v2

      - name: Calculate 2024 team talent composition
        run: |
          python -m ratings.team_talent_composition 2024

      - name: Validate team talent composition
        run: |
          python -m ratings.validate_team_talent_composition

      - name: Download 2024 coaching data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_coaching_data 2024

      - name: Download 2025 coaching data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_coaching_data 2025

      - name: Calculate 2025 coaching continuity V2
        run: |
          python -m ratings.coaching_continuity_v2 2025

      - name: Validate 2025 coaching continuity V2
        run: |
          python -m ratings.validate_coaching_continuity_v2

      - name: Show generated processed files
        run: |
          echo "Processed files:"
          find data/processed -maxdepth 1 -type f -print | sort

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw
          git add data/processed

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update preseason model data"
            git push
          fi
