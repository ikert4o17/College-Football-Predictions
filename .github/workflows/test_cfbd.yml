name: Update FBS Data

on:
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download FBS teams
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_teams

      - name: Process FBS teams
        run: |
          python -m data.process_teams

      - name: Download 2026 games
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_games 2026

      - name: Process 2026 games
        run: |
          python -m data.process_games

      - name: Download 2025 historical stats
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_historical_stats 2025

      - name: Process 2025 historical stats
        run: |
          python -m data.process_historical_stats

      - name: Download 2025 historical games
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_historical_games 2025

      - name: Process 2025 historical games
        run: |
          python -m data.process_historical_games

      - name: Process 2025 team results
        run: |
          python -m data.process_team_results

      - name: Calculate 2025 team strength
        run: |
          python -m ratings.team_strength

      - name: Calculate 2025 strength of schedule
        run: |
          python -m ratings.strength_of_schedule

      - name: Calculate 2025 power ratings
        run: |
          python -m ratings.power_rating

      - name: Display data counts
        run: |
          python -c "import json; teams=json.load(open('data/processed/teams.json')); games2026=json.load(open('data/processed/games.json')); stats=json.load(open('data/processed/historical_stats_2025.json')); games2025=json.load(open('data/processed/historical_games_2025.json')); strength=json.load(open('data/processed/team_strength_2025.json')); results=json.load(open('data/processed/team_results_2025.json')); sos=json.load(open('data/processed/strength_of_schedule_2025.json')); ratings=json.load(open('data/processed/power_ratings_2025.json')); fbs=sum(1 for g in games2025 if g['game_classification']=='fbs_vs_fbs'); lower=sum(1 for g in games2025 if g['game_classification']=='fbs_vs_lower'); print(f'Processed teams: {len(teams)}'); print(f'2026 games: {len(games2026)}'); print(f'2025 team profiles: {len(stats)}'); print(f'2025 FBS games: {len(games2025)}'); print(f'2025 FBS vs FBS: {fbs}'); print(f'2025 FBS vs lower: {lower}'); print(f'2025 team strength profiles: {len(strength)}'); print(f'2025 team result profiles: {len(results)}'); print(f'2025 SOS profiles: {len(sos)}'); print(f'2025 power ratings: {len(ratings)}')"

      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/teams.json \
                  data/raw/games.json \
                  data/raw/stats.json \
                  data/raw/historical_stats/2025.json \
                  data/raw/historical_games/2025.json \
                  data/processed/teams.json \
                  data/processed/games.json \
                  data/processed/historical_stats_2025.json \
                  data/processed/historical_games_2025.json \
                  data/processed/team_strength_2025.json \
                  data/processed/team_results_2025.json \
                  data/processed/strength_of_schedule_2025.json \
                  data/processed/power_ratings_2025.json

          if git diff --cached --quiet; then
            echo "No changes to data."
          else
            git commit -m "Update FBS data"
            git push
          fi
