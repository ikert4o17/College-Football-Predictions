name: Test CFBD Pipeline

on:
  workflow_dispatch:

jobs:
  test-cfbd:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      # ============================================================
      # TEAMS
      # ============================================================

      - name: Download teams
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_teams

      - name: Process teams
        run: |
          python -m data.process_teams

      # ============================================================
      # 2026 GAMES
      # ============================================================

      - name: Download 2026 games
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_games 2026

      - name: Process 2026 games
        run: |
          python -m data.process_games 2026

      # ============================================================
      # 2025 HISTORICAL DATA
      # ============================================================

      - name: Download 2025 historical stats
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_historical_stats 2025

      - name: Process 2025 historical stats
        run: |
          python -m data.process_historical_stats 2025

      - name: Download 2025 historical games
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_historical_games 2025

      - name: Process 2025 historical games
        run: |
          python -m data.process_historical_games 2025

      # ============================================================
      # 2025 RATINGS
      # ============================================================

      - name: Calculate 2025 team strength
        run: |
          python -m ratings.team_strength

      - name: Calculate 2025 team results
        run: |
          python -m data.process_team_results

      - name: Calculate 2025 strength of schedule
        run: |
          python -m ratings.strength_of_schedule

      - name: Calculate 2025 power ratings
        run: |
          python -m ratings.power_rating

      - name: Test 2025 game predictions
        run: |
          python -m predictions.game_predictor

      # ============================================================
      # 2024 HISTORICAL DATA
      # ============================================================

      - name: Download 2024 historical stats
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_historical_stats 2024

      - name: Process 2024 historical stats
        run: |
          python -m data.process_historical_stats 2024

      - name: Download 2024 historical games
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_historical_games 2024

      - name: Process 2024 historical games
        run: |
          python -m data.process_historical_games 2024

      # ============================================================
      # 2024 RATINGS
      # ============================================================

      - name: Calculate 2024 team strength
        run: |
          python -m ratings.team_strength_2024

      - name: Calculate 2024 team results
        run: |
          python -m data.process_team_results_2024

      - name: Calculate 2024 strength of schedule
        run: |
          python -m ratings.strength_of_schedule_2024

      - name: Calculate 2024 power ratings
        run: |
          python -m ratings.power_rating_2024

      - name: Test season continuity
        run: |
          python -m ratings.season_continuity

      # ============================================================
      # 2025 RETURNING PRODUCTION VALIDATION
      # ============================================================

      - name: Download 2025 returning production
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_returning_production 2025

      - name: Process 2025 returning production
        run: |
          python -m data.process_returning_production 2025

      - name: Analyze returning production
        run: |
          python -m ratings.analyze_returning_production

      - name: Validate returning production
        run: |
          python -m ratings.validate_returning_production

      # ============================================================
      # 2025 TRANSFER PORTAL VALIDATION
      # ============================================================

      - name: Download 2025 transfer portal
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_transfer_portal 2025

      - name: Process 2025 transfer portal
        run: |
          python -m data.process_transfer_portal 2025

      - name: Validate 2025 transfer portal
        run: |
          python -m ratings.validate_transfer_portal

      # ============================================================
      # HISTORICAL RECRUITING DATA
      # ============================================================

      - name: Download 2019-2025 recruiting players
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_recruiting_players 2019 2025

      # ============================================================
      # 2025 TRANSFER TALENT VALIDATION
      # ============================================================

      - name: Enrich 2025 transfer portal talent
        run: |
          python -m data.enrich_transfer_portal 2025

      - name: Calculate 2025 transfer talent metrics
        run: |
          python -m ratings.transfer_talent 2025

      - name: Validate composite-weighted transfer talent
        run: |
          python -m ratings.validate_transfer_talent

      # ============================================================
      # 2025 RECRUITING TALENT VALIDATION
      # ============================================================

      - name: Calculate 2025 recruiting talent metrics
        run: |
          python -m ratings.recruiting_talent 2025

      - name: Validate 2025 recruiting talent
        run: |
          python -m ratings.validate_recruiting_talent

      # ============================================================
      # NFL DRAFT LOSS VALIDATION
      # ============================================================

      - name: Download 2025 NFL draft picks
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_draft_picks 2025

      - name: Calculate 2025 NFL draft loss metrics
        run: |
          python -m ratings.draft_losses

      - name: Validate 2025 NFL draft losses
        run: |
          python -m ratings.validate_draft_losses

      # ============================================================
      # HISTORICAL PRESEASON MODEL VALIDATION
      # ============================================================

      - name: Run combined preseason model V2
        run: |
          python -m ratings.preseason_model

      # ============================================================
      # SP+ DATA + VALIDATION
      # ============================================================

      - name: Download 2024-2025 SP+ ratings
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_sp_ratings 2024 2025

      - name: Validate SP+ baseline blend
        run: |
          python -m ratings.validate_sp_baseline

      - name: Run SP+ anchored preseason model V3
        run: |
          python -m ratings.preseason_model_v3

      # ============================================================
      # QB CONTINUITY DIAGNOSTIC DATA
      # ============================================================

      - name: Download 2024 QB diagnostic data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_qb_data 2024

      - name: Download 2025 QB diagnostic data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_qb_data 2025

      - name: Calculate 2025 QB continuity metrics
        run: |
          python -m ratings.qb_continuity 2025

      # ============================================================
      # 2026 PRODUCTION INPUTS
      # ============================================================

      - name: Download 2026 returning production
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_returning_production 2026

      - name: Process 2026 returning production
        run: |
          python -m data.process_returning_production 2026

      - name: Download 2026 transfer portal
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_transfer_portal 2026

      - name: Process 2026 transfer portal
        run: |
          python -m data.process_transfer_portal 2026

      - name: Download 2026 recruiting players
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_recruiting_players 2026 2026

      - name: Enrich 2026 transfer portal talent
        run: |
          python -m data.enrich_transfer_portal 2026

      - name: Calculate 2026 transfer talent metrics
        run: |
          python -m ratings.transfer_talent 2026

      - name: Calculate 2026 recruiting talent metrics
        run: |
          python -m ratings.recruiting_talent 2026

      # ============================================================
      # 2026 PRESEASON POWER RATINGS
      # ============================================================

      - name: Generate 2026 Project Gridiron preseason ratings
        run: |
          python -m ratings.preseason_rating_2026
