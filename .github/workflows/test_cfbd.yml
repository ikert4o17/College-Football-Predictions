name: Test CFBD Pipeline

on:
  workflow_dispatch:

jobs:
  test-cfbd:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Download teams
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_teams

      - name: Process teams
        run: |
          python -m data.process_teams

      - name: Download 2026 games
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_games 2026

      - name: Process 2026 games
        run: |
          python -m data.process_games 2026

      - name: Download 2025 historical stats
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_historical_stats 2025

      - name: Process 2025 historical stats
        run: |
          python -m data.process_historical_stats 2025

      - name: Download 2025 historical games
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_historical_games 2025

      - name: Process 2025 historical games
        run: |
          python -m data.process_historical_games 2025

      - name: Calculate 2025 team strength
        run: |
          python -m ratings.team_strength

      - name: Calculate 2025 strength of schedule
        run: |
          python -m ratings.strength_of_schedule

      - name: Calculate 2025 power ratings
        run: |
          python -m ratings.power_rating

      - name: Test 2025 game predictions
        run: |
          python -m predictions.game_predictor

      - name: Download 2024 historical stats
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_historical_stats 2024

      - name: Process 2024 historical stats
        run: |
          python -m data.process_historical_stats 2024

      - name: Download 2024 historical games
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.process_historical_games 2024

      - name: Calculate 2024 team strength
        run: |
          python -m ratings.team_strength_2024

      - name: Calculate 2024 strength of schedule
        run: |
          python -m ratings.strength_of_schedule_2024

      - name: Calculate 2024 power ratings
        run: |
          python -m ratings.power_rating_2024

      - name: Test season continuity
        run: |
          python -m ratings.season_continuity

      - name: Download 2025 returning production
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_returning_production 2025

      - name: Process 2025 returning production
        run: |
          python -m data.process_returning_production

      - name: Analyze returning production
        run: |
          python -m ratings.analyze_returning_production

      - name: Validate returning production
        run: |
          python -m ratings.validate_returning_production

      - name: Download 2025 transfer portal
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_transfer_portal 2025

      - name: Process 2025 transfer portal
        run: |
          python -m data.process_transfer_portal 2025

      - name: Validate transfer portal
        run: |
          python -m ratings.validate_transfer_portal

      - name: Inspect CFBD player search
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests

          headers = {
              "Authorization": f"Bearer {os.environ['CFBD_API_KEY']}"
          }

          url = "https://api.collegefootballdata.com/player/search"

          response = requests.get(
              url,
              headers=headers,
              params={
                  "searchTerm": "Arch Manning"
              },
              timeout=30,
          )

          print("=" * 70)
          print("CFBD PLAYER SEARCH")
          print("=" * 70)
          print(f"Status code: {response.status_code}")
          print()

          try:
              data = response.json()
              print(json.dumps(data, indent=2))
          except Exception:
              print(response.text)
          PY

      - name: Inspect CFBD player stats
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests

          headers = {
              "Authorization": f"Bearer {os.environ['CFBD_API_KEY']}"
          }

          url = "https://api.collegefootballdata.com/stats/player/season"

          response = requests.get(
              url,
              headers=headers,
              params={
                  "year": 2025,
                  "team": "Texas"
              },
              timeout=30,
          )

          print("=" * 70)
          print("CFBD PLAYER SEASON STATS")
          print("=" * 70)
          print(f"Status code: {response.status_code}")
          print()

          try:
              data = response.json()

              print(f"Records returned: {len(data)}")
              print()

              if data:
                  print("FIRST RECORD:")
                  print(json.dumps(data[0], indent=2))

                  print()
                  print("FIELDS:")
                  print(sorted(data[0].keys()))

          except Exception:
              print(response.text)
          PY

      - name: Inspect CFBD player game stats
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests

          headers = {
              "Authorization": f"Bearer {os.environ['CFBD_API_KEY']}"
          }

          url = "https://api.collegefootballdata.com/stats/player/game"

          response = requests.get(
              url,
              headers=headers,
              params={
                  "year": 2025,
                  "team": "Texas"
              },
              timeout=30,
          )

          print("=" * 70)
          print("CFBD PLAYER GAME STATS")
          print("=" * 70)
          print(f"Status code: {response.status_code}")
          print()

          try:
              data = response.json()

              print(f"Records returned: {len(data)}")
              print()

              if data:
                  print("FIRST RECORD:")
                  print(json.dumps(data[0], indent=2))

                  print()
                  print("FIELDS:")
                  print(sorted(data[0].keys()))

          except Exception:
              print(response.text)
          PY
