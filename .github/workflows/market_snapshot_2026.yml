name: 2026 Market Snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/market_snapshot_2026.yml"
  schedule:
    # Higher frequency on the main college-football game days.
    - cron: "0 */2 * * 4-6"
    # Lower frequency Sunday-Wednesday to cover non-Saturday games while conserving quota.
    - cron: "0 */6 * * 0-3"

permissions:
  contents: write

concurrency:
  group: 2026-market-snapshot
  cancel-in-progress: false

jobs:
  capture-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install requests

      - name: Capture current NCAAF spread and total consensus
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m data.capture_market_odds_2026

      - name: Commit market archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/market_archive_2026.json
          if git diff --cached --quiet; then
            echo "No market snapshot changes to commit."
          else
            git commit -m "Capture 2026 market odds snapshot"
            git push
          fi
