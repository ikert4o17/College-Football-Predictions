name: Update FBS Data

on:
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download FBS teams
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_teams

      - name: Process FBS teams
        run: |
          python -m data.process_teams

      - name: Download 2026 games
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_games 2026

      - name: Process games
        run: |
          python -m data.process_games

      - name: Display data counts
        run: |
          python -c "import json; teams=json.load(open('data/processed/teams.json')); games=json.load(open('data/processed/games.json')); print(f'Processed teams: {len(teams)}'); print(f'Processed games: {len(games)}')"

      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/teams.json data/raw/games.json data/processed/teams.json data/processed/games.json

          if git diff --cached --quiet; then
            echo "No changes to data."
          else
            git commit -m "Update FBS data"
            git push
          fi
