name: Download FBS Teams

on:
  workflow_dispatch:

jobs:
  download-teams:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download FBS teams
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m data.download_teams

      - name: Display team count
        run: |
          python -c "import json; data=json.load(open('data/raw/teams.json')); print(f'Teams downloaded: {len(data)}')"

      - name: Save team data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/teams.json

          if git diff --cached --quiet; then
            echo "No changes to team data."
          else
            git commit -m "Update FBS team data"
            git push
          fi
