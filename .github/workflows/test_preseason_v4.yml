name: Test Preseason Model V4

on:
  workflow_dispatch:

jobs:
  test-v4:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # SETUP
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      # ============================================================
      # VERIFY REQUIRED V4 INPUTS
      # ============================================================

      - name: Verify V4 input files
        run: |
          echo "Checking required Project Gridiron V4 inputs..."
          echo ""

          FILES=(
            "data/raw/sp_ratings/2024.json"
            "data/processed/power_ratings_2024.json"
            "data/processed/power_ratings_2025.json"
          )

          MISSING=0

          for FILE in "${FILES[@]}"; do
            if [ -f "$FILE" ]; then
              echo "FOUND:   $FILE"
            else
              echo "MISSING: $FILE"
              MISSING=1
            fi
          done

          echo ""
          echo "Files under data/raw/sp_ratings:"
          find data/raw/sp_ratings -maxdepth 1 -type f -print 2>/dev/null | sort || true

          echo ""
          echo "Files under data/raw/returning_production:"
          find data/raw/returning_production -maxdepth 1 -type f -print 2>/dev/null | sort || true

          echo ""
          echo "Files under data/raw/coaching:"
          find data/raw/coaching -maxdepth 3 -type f -print 2>/dev/null | sort || true

          echo ""
          echo "Files under data/raw/qb_data:"
          find data/raw/qb_data -maxdepth 3 -type f -print 2>/dev/null | sort || true

          echo ""
          echo "Files under data/processed:"
          find data/processed -maxdepth 1 -type f -print 2>/dev/null | sort || true

          echo ""

          if [ "$MISSING" -ne 0 ]; then
            echo "One or more required V4 core files are missing."
            exit 1
          fi

          echo "All core V4 files found."

      # ============================================================
      # REBUILD HISTORICAL DERIVED FEATURES
      #
      # THESE STEPS USE EXISTING RAW FILES ONLY.
      # NO CFBD API CALLS.
      # ============================================================

      - name: Process 2025 returning production
        run: |
          python -m data.process_returning_production 2025

      - name: Calculate 2025 transfer talent
        run: |
          python -m ratings.transfer_talent 2025

      - name: Calculate 2025 transfer production V2
        run: |
          python -m ratings.transfer_production_v2 2025

      - name: Calculate 2025 QB continuity
        run: |
          python -m ratings.qb_continuity 2025

      - name: Calculate 2025 coaching continuity V2
        run: |
          python -m ratings.coaching_continuity_v2 2025

      # ============================================================
      # SANITY VALIDATION
      # ============================================================

      - name: Validate returning production
        run: |
          python -m ratings.validate_returning_production

      - name: Validate transfer talent
        run: |
          python -m ratings.validate_transfer_talent

      - name: Validate transfer production V2
        run: |
          python -m ratings.validate_transfer_production_v2

      - name: Validate QB continuity
        run: |
          python -m ratings.validate_qb_continuity

      - name: Validate coaching continuity V2
        run: |
          python -m ratings.validate_coaching_continuity_v2

      # ============================================================
      # COMBINED PRESEASON MODEL V4
      # ============================================================

      - name: Run combined preseason model V4
        run: |
          python -m ratings.preseason_model_v4

      # ============================================================
      # OUTPUT CHECK
      # ============================================================

      - name: Verify V4 output
        run: |
          echo "Checking V4 output file..."
          echo ""

          if [ -f "data/processed/preseason_model_v4_validation_2025.json" ]; then
            echo "FOUND: data/processed/preseason_model_v4_validation_2025.json"
            ls -lh data/processed/preseason_model_v4_validation_2025.json
          else
            echo "MISSING: data/processed/preseason_model_v4_validation_2025.json"
            exit 1
          fi

      # ============================================================
      # FINAL FILE LIST
      # ============================================================

      - name: Show final processed files
        run: |
          echo "Processed files:"
          echo ""
          find data/processed -maxdepth 1 -type f -print | sort
