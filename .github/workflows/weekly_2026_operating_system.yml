name: 2026 Weekly Operating System

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/weekly_2026_operating_system.yml"
  schedule:
    # Sunday afternoon: 4:00 PM Central during daylight time (21:00 UTC).
    # After daylight saving time ends, this runs at 3:00 PM Central.
    # Manual test trigger: 2026-08-29.
    - cron: "0 21 * * 0"

permissions:
  contents: write

concurrency:
  group: 2026-weekly-operating-system
  cancel-in-progress: false

jobs:
  weekly-update:
    runs-on: ubuntu-latest
    env:
      CFBD_MAX_CALLS_THIS_RUN: "20"
      CFBD_REQUEST_BUDGET_RUN_ID: ${{ github.run_id }}
      CFBD_MIN_REMAINING_CALLS: "100"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Refresh 2026 games and results
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m data.download_games 2026

      - name: Grade previously published predictions
        run: python -m predictions.grade_2026_predictions

      - name: Create frozen Balanced Light preseason ratings if missing
        run: |
          if [ -f data/processed/preseason_ratings_2026.json ]; then
            echo "Frozen preseason ratings already exist; preserving immutable Week 0 anchor."
          else
            python -m ratings.freeze_preseason_2026
          fi

      - name: Rebuild current in-season ratings
        run: python -m ratings.inseason_ratings_2026

      - name: Generate upcoming predictions
        run: python -m predictions.weekly_2026_predictions

      - name: Build weekly state and immutable rating snapshot
        run: python -m data.weekly_state_2026

      - name: Package rankings, predictions and performance for website
        run: python -m data.publish_weekly_2026

      - name: Run weekly health and completeness audit
        run: python -m data.weekly_health_2026

      - name: Validate complete weekly package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          preseason = json.loads((root/'data/processed/preseason_ratings_2026.json').read_text())
          ratings_doc = json.loads((root/'data/processed/inseason_ratings_2026.json').read_text())
          state = json.loads((root/'data/processed/weekly_state_2026.json').read_text())
          manifest = json.loads((root/'site_data/rankings_2026.json').read_text())
          predictions = json.loads((root/'site_data/game_predictions_2026.json').read_text())
          performance = json.loads((root/'site_data/model_performance_2026.json').read_text())
          health = json.loads((root/'data/processed/weekly_health_2026.json').read_text())
          ratings = ratings_doc.get('ratings', [])
          applied = ratings_doc.get('games_applied', [])

          assert len(preseason) >= 130, f"Incomplete frozen preseason: {len(preseason)}"
          assert len(ratings) >= 130, f"Incomplete live ratings: {len(ratings)}"
          assert manifest.get('teams') == len(ratings), "Site ranking count mismatch"
          assert health.get('status') != 'FAIL', "Weekly health audit failed"
          ids = [str(g.get('game_id')) for g in applied if g.get('game_id') is not None]
          assert len(ids) == len(set(ids)), "Duplicate game application detected"
          assert state.get('completed_fbs_vs_fbs_games', 0) >= len(applied), "Weekly state inconsistent"
          for part in manifest.get('parts', []):
              assert (root/part).exists(), f"Missing ranking part: {part}"
          for p in predictions:
              for key in ('home_team','away_team','projected_winner','projected_margin','projected_total','model_version'):
                  assert key in p, f"Prediction missing {key}"
          assert 'cumulative' in performance and 'by_week' in performance, "Performance ledger malformed"
          assert (root/'site_data/rating_movers_2026.json').exists(), "Rating movers missing"

          print("Weekly package validated")
          print("Teams:", len(ratings))
          print("Games applied:", len(applied))
          print("Latest completed week:", state.get('latest_completed_week'))
          print("Upcoming predictions:", len(predictions))
          print("Graded predictions:", performance.get('cumulative', {}).get('games'))
          print("Health:", health.get('status'))
          PY

      - name: Upload weekly diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-gridiron-weekly-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            data/processed/weekly_health_2026.json
            data/processed/weekly_state_2026.json
            data/processed/model_performance_2026.json

      - name: Commit weekly model state and website data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/raw/games.json \
            data/processed/preseason_ratings_2026.json \
            data/processed/inseason_ratings_2026.json \
            data/processed/game_predictions_2026.json \
            data/processed/weekly_state_2026.json \
            data/processed/model_performance_2026.json \
            data/processed/weekly_health_2026.json \
            data/snapshots/2026 \
            site_data/rankings_2026.json \
            site_data/rankings_2026_part*.json \
            site_data/game_predictions_2026.json \
            site_data/model_performance_2026.json \
            site_data/rating_movers_2026.json
          if git diff --cached --quiet; then
            echo "No weekly changes to commit."
          else
            git commit -m "Run 2026 weekly model update"
            git push
          fi
